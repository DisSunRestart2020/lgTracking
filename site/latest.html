*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink)}body{background-image:radial-gradient(ellipse at 14% 15%,rgba(44,111,176,.22),transparent 42%),radial-gradient(ellipse at 88% 80%,rgba(120,58,177,.2),transparent 38%),linear-gradient(135deg,#06101e,#0b1426 52%,#081425)}body.theme-gst{--accent:#6ff0d0;--hot:#41a9ff;--glow:rgba(51,226,203,.22);--line:rgba(111,240,208,.22)}#deck{position:relative;width:100%;height:100%;isolation:isolate}.slide{position:absolute;inset:0;display:none;padding:2.1vh var(--page-x) 4.1vh;overflow:hidden}.slide.active{display:flex;flex-direction:column;z-index:3}.slide.leave{display:flex;z-index:2;pointer-events:none}.slide:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:-1;opacity:.42;background-image:linear-gradient(rgba(133,190,231,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(133,190,231,.035) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent 88%)}.slide:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:4;opacity:.10;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(160,220,255,.08) 4px);mix-blend-mode:screen}.topline{display:flex;align-items:center;justify-content:space-between;gap:2vw;min-height:9vh;border-bottom:1px solid var(--line);padding-bottom:1vh;margin-bottom:1.4vh;position:relative}.brand{font-size:var(--head-size);font-weight:950;letter-spacing:.035em;line-height:1;text-shadow:0 0 26px var(--glow);white-space:nowrap}.section-title{font-size:clamp(24px,2.2vw,42px);font-weight:750;letter-spacing:.05em;color:#cde7ff;margin-left:auto;text-align:right}.theme-gst .section-title{color:#cafff1}.badge{font-size:clamp(15px,1.1vw,22px);letter-spacing:.12em;color:var(--accent);border:1px solid var(--line);padding:.5em .8em;border-radius:999px;background:rgba(6,20,35,.55);white-space:nowrap}.footer{position:absolute;left:var(--page-x);right:var(--page-x);bottom:1.1vh;display:flex;justify-content:space-between;align-items:center;color:#8da5bf;font-size:clamp(12px,.85vw,17px);letter-spacing:.03em;z-index:5}.page-count{color:var(--accent);font-weight:700}.progress-track{position:absolute;left:0;bottom:0;width:100%;height:5px;background:rgba(160,202,241,.13);z-index:8}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--hot));box-shadow:0 0 14px var(--accent)}.panel{background:linear-gradient(145deg,rgba(19,39,62,.92),rgba(9,22,39,.78));border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 46px rgba(0,0,0,.18),inset 0 1px rgba(255,255,255,.04);position:relative;overflow:hidden}.panel:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--accent),transparent 84%);opacity:.9}.label{font-size:clamp(13px,.93vw,18px);color:var(--muted);letter-spacing:.09em;text-transform:uppercase}.value{font-size:clamp(27px,2.1vw,42px);font-weight:800;line-height:1.13}.small-note{font-size:clamp(13px,.92vw,18px);color:var(--muted);line-height:1.4}.accent{color:var(--accent)}.hot{color:var(--hot)}.danger{color:var(--danger)}.good{color:var(--good)}.warn{color:var(--warn)}.headline{font-size:clamp(26px,2vw,40px);font-weight:780;margin:0 0 1vh}.overview{display:flex;flex-direction:column;min-height:0;flex:1;gap:1.25vh}.overview-head{display:grid;grid-template-columns:1.1fr .9fr;gap:1.2vw;min-height:8vh}.sprint-card,.status-card{padding:1.1vh 1.3vw;display:flex;align-items:center;justify-content:space-between;gap:1vw}.sprint-meta{display:flex;flex-direction:column;gap:.55vh}.sprint-name{font-size:clamp(24px,2vw,38px);font-weight:850}.date-range{font-size:clamp(17px,1.25vw,24px);color:#d9e9fa}.remaining{font-size:clamp(26px,2.1vw,42px);font-weight:900;color:var(--warn);white-space:nowrap;text-shadow:0 0 20px rgba(255,206,104,.28)}.status-card{line-height:1.65;align-items:center}.status-text{font-size:clamp(27px,2vw,40px);font-weight:900;letter-spacing:.1em;white-space:nowrap}.status-explain{font-size:clamp(14px,1vw,20px);color:var(--muted);line-height:1.65}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2vw;min-height:10vh}.kpi{padding:1.05vh 1.2vw;display:flex;align-items:center;justify-content:space-between;gap:.6vw}.kpi-main{display:flex;flex-direction:column;gap:.65vh}.ratio{font-size:clamp(18px,1.35vw,27px);color:#dbeaff}.meter{width:15vw;max-width:240px;height:8px;background:#172b42;border-radius:999px;overflow:hidden;border:1px solid rgba(255,255,255,.08)}.meter>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--hot));box-shadow:0 0 12px var(--accent)}.goal-panel{padding:1.2vh 1.4vw;flex:0 0 auto;max-height:20vh}.goal-text{font-size:clamp(17px,1.33vw,26px);line-height:1.48;white-space:pre-wrap;overflow:visible;color:#f2f7ff;margin-top:.5vh}.chart-panel{padding:.5vh .8vw .3vh;flex:1;min-height:31vh;display:flex;flex-direction:column}.chart-head{display:flex;justify-content:space-between;align-items:center;padding:.35vh .45vw}.chart-title{font-size:clamp(18px,1.35vw,26px);font-weight:760}.chart-legend{display:flex;gap:1.4vw;align-items:center;color:#bed1e4;font-size:clamp(12px,.88vw,17px)}.legend-item{display:flex;gap:.45em;align-items:center}.legend-line{width:30px;height:0;border-top:3px solid}.legend-line.planned{border-color:#88a1bb;border-style:dashed}.legend-line.actual{border-color:var(--accent)}.legend-line.forecast{border-color:var(--warn);border-style:dashed}.chart-wrap{flex:1;min-height:0}svg.chart{display:block;width:100%;height:100%;overflow:visible}.chart text{font-family:inherit;fill:#b9c9dc;font-size:15px}.chart .grid{stroke:rgba(163,194,224,.15);stroke-width:1}.chart .axis{stroke:rgba(204,225,246,.45);stroke-width:1.4}.chart .planned-line{fill:none;stroke:#829ab3;stroke-width:3;stroke-dasharray:10 8}.chart .actual-line{fill:none;stroke:var(--accent);stroke-width:5;filter:drop-shadow(0 0 7px var(--accent))}.chart .forecast-line{fill:none;stroke:var(--warn);stroke-width:4;stroke-dasharray:10 7}.chart .point{fill:var(--accent);stroke:#e2f7ff;stroke-width:2}.chart .current-point{fill:var(--warn);stroke:#fff2cc;stroke-width:2}.g-overview{display:flex;flex:1;min-height:0;flex-direction:column;gap:2vh}.g-metrics{display:grid;grid-template-columns:1.1fr 1fr .9fr;gap:1.3vw}.g-score{padding:2vh 1.5vw;min-height:20vh;display:flex;flex-direction:column;justify-content:space-between}.g-score .value{font-size:clamp(46px,4vw,78px)}.g-bar{height:17px;border-radius:99px;background:#152e43;margin-top:1vh;overflow:hidden}.g-bar i{display:block;height:100%;background:linear-gradient(90deg,#50e5c5,#58aaff);box-shadow:0 0 18px #50e5c5}.g-status{display:flex;align-items:center;gap:1vw}.g-status .status-text{font-size:clamp(36px,3.2vw,64px)}.g-note{padding:2vh 1.5vw;font-size:clamp(19px,1.6vw,32px);line-height:1.7}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:1.3vw;flex:1;min-height:0}.section-panel{padding:1.2vh 1.1vw;display:flex;flex-direction:column;min-height:0}.section-panel h2{font-size:clamp(21px,1.65vw,32px);margin:0 0 .9vh;font-weight:790}.section-panel p{margin:.4vh 0;line-height:1.55}.story-columns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1vw;flex:1;min-height:0}.story-column{display:flex;flex-direction:column;padding:1vh .9vw;min-height:0}.story-column h2{display:flex;justify-content:space-between;align-items:baseline;gap:.5vw;margin:0 0 .75vh;font-size:clamp(19px,1.5vw,30px);font-weight:820}.story-column .cards{display:flex;flex-direction:column;gap:.45vh;min-height:0;overflow:visible}.story-card{border-left:2px solid var(--line);padding:.45vh .55vw;background:rgba(255,255,255,.025);border-radius:0 7px 7px 0}.story-card .title{font-size:clamp(14px,.98vw,19px);line-height:1.25;color:#eef5fc;overflow-wrap:anywhere}.story-card .meta{font-size:clamp(11px,.75vw,15px);color:#9db2c8;line-height:1.25;margin-top:.18vh}.experiments{display:grid;grid-template-columns:repeat(3,1fr);gap:1vw;flex:1;min-height:0}.experiment-card{padding:.9vh .9vw;min-height:0}.experiment-card .title{font-size:clamp(15px,1.08vw,21px);line-height:1.3;font-weight:650;overflow-wrap:anywhere}.experiment-card .meta{font-size:clamp(12px,.8vw,16px);line-height:1.3;color:#a8bed1;margin-top:.45vh}.exp-head{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;padding:.6vh .6vw}.exp-head h2{font-size:clamp(22px,1.7vw,34px);margin:0}.exp-empty{padding:1.2vh 1vw;color:#91a8bf;font-size:clamp(14px,1vw,20px)}.forecast-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1vw;margin-bottom:1.2vh}.forecast-box{padding:1.3vh 1.1vw;min-height:13vh}.forecast-box .value{font-size:clamp(25px,2vw,40px);margin-top:.5vh}.risk-list{display:flex;flex-direction:column;gap:.55vh;overflow:auto;min-height:0}.risk-row{display:grid;grid-template-columns:1fr auto;gap:.7vw;align-items:center;padding:.75vh .7vw;border-bottom:1px solid rgba(180,210,240,.11);font-size:clamp(14px,1.04vw,20px);line-height:1.3}.risk-row .risk-owner{color:#abc0d5;font-size:.88em;margin-top:.2vh}.risk-row .risk-due{color:var(--warn);font-size:.88em;text-align:right;white-space:nowrap}.risk-empty{font-size:clamp(17px,1.35vw,26px);color:#c2d5e6;padding:2vh 1vw;line-height:1.7}.action-text{font-size:clamp(18px,1.4vw,28px);line-height:1.65}.action-text strong{color:var(--accent)}.summary-strip{display:flex;gap:1vw;flex-wrap:wrap;margin-top:1vh}.summary-chip{font-size:clamp(13px,.9vw,18px);padding:.45em .75em;border:1px solid var(--line);border-radius:999px;color:#cad9e9;background:rgba(255,255,255,.03)}
/* 六种分别设计的平滑转场 */
.slide.enter.fx1{animation:warp-in .95s cubic-bezier(.18,.82,.22,1) both}.slide.leave.fx1{animation:warp-out .65s ease-in both}
.slide.enter.fx2{animation:holo-in 1.05s cubic-bezier(.16,.7,.21,1) both}.slide.leave.fx2{animation:holo-out .72s ease-in both}
.slide.enter.fx3{animation:scan-in .95s cubic-bezier(.2,.9,.22,1) both}.slide.leave.fx3{animation:scan-out .7s ease-in both}
.slide.enter.fx4{animation:quantum-in 1.05s cubic-bezier(.15,.85,.18,1) both}.slide.leave.fx4{animation:quantum-out .7s ease-in both}
.slide.enter.fx5{animation:flare-in .92s cubic-bezier(.17,.82,.28,1) both}.slide.leave.fx5{animation:flare-out .65s ease-in both}
.slide.enter.fx6{animation:portal-in 1.05s cubic-bezier(.17,.82,.2,1) both}.slide.leave.fx6{animation:portal-out .7s ease-in both}
@keyframes warp-in{from{opacity:0;transform:perspective(1500px) rotateY(-18deg) translateX(7vw) scale(.94);filter:blur(13px)}to{opacity:1;transform:none;filter:blur(0)}}@keyframes warp-out{to{opacity:0;transform:perspective(1500px) rotateY(14deg) translateX(-4vw) scale(.96);filter:blur(9px)}}
@keyframes holo-in{0%{opacity:0;clip-path:inset(0 100% 0 0);filter:brightness(2.4) saturate(1.6)}65%{opacity:1;clip-path:inset(0 0 0 0);filter:brightness(1.5)}100%{filter:brightness(1)}}@keyframes holo-out{to{opacity:0;transform:translateY(-2vh) skewY(-1deg);filter:brightness(2) blur(5px)}}
@keyframes scan-in{0%{opacity:0;clip-path:inset(100% 0 0 0);filter:blur(10px)}100%{opacity:1;clip-path:inset(0);filter:blur(0)}}@keyframes scan-out{to{opacity:0;clip-path:inset(0 0 100% 0);filter:blur(6px)}}
@keyframes quantum-in{0%{opacity:0;transform:scale(.78) rotateX(12deg);filter:blur(16px) hue-rotate(50deg)}70%{opacity:1;transform:scale(1.015) rotateX(0);filter:blur(0) hue-rotate(0)}100%{transform:scale(1)}}@keyframes quantum-out{to{opacity:0;transform:scale(1.08) rotateX(-7deg);filter:blur(10px)}}
@keyframes flare-in{0%{opacity:0;transform:scale(1.12) translateY(2vh);filter:blur(14px) brightness(2)}55%{opacity:1;transform:scale(.99);filter:blur(0) brightness(1.4)}100%{transform:scale(1);filter:brightness(1)}}@keyframes flare-out{to{opacity:0;transform:scale(.92) translateY(-2vh);filter:blur(9px) brightness(1.8)}}
@keyframes portal-in{0%{opacity:0;clip-path:circle(0% at 50% 50%);filter:blur(12px) saturate(1.8)}100%{opacity:1;clip-path:circle(145% at 50% 50%);filter:blur(0) saturate(1)}}@keyframes portal-out{to{opacity:0;clip-path:circle(0% at 50% 50%);filter:blur(10px)}}
@media(max-width:1200px){:root{--page-x:3vw}.story-columns{grid-template-columns:1fr 1fr}.topline{min-height:8vh}.goal-text{font-size:17px}.story-card .title{font-size:14px}.experiments{grid-template-columns:repeat(2,1fr)}}@media(max-height:800px){.slide{padding-top:1.2vh}.topline{min-height:7vh;margin-bottom:.8vh}.overview{gap:.7vh}.goal-panel{max-height:17vh}.goal-text{font-size:clamp(15px,1.1vw,20px);line-height:1.32}.story-card .title{font-size:clamp(12px,.88vw,16px)}.story-card .meta{font-size:11px}.forecast-box{min-height:10vh}}
@media(prefers-reduced-motion:reduce){.slide.enter,.slide.leave{animation:fade-simple .3s ease both}@keyframes fade-simple{from{opacity:0}to{opacity:1}}}

/* 大屏修订：原图完整填充、目标保留换行、长列表同页展示 */
.goal-panel{max-height:none;overflow:visible;flex-shrink:0;padding:1vh 1.2vw}.goal-text{font-size:clamp(18px,1.2vw,25px);line-height:1.48;white-space:pre-wrap;overflow:visible}.overview{gap:1vh}.overview-head{min-height:10vh;grid-template-columns:1.1fr 1fr}.sprint-card{flex-wrap:wrap}.remaining{font-size:clamp(25px,1.9vw,40px)}.status-explain{font-size:clamp(14px,1vw,20px);line-height:1.7}.status-card{gap:1.2vw}.status-text{font-size:clamp(25px,1.85vw,38px)}.kpi{padding:.9vh 1.1vw;min-width:0}.kpis{min-height:9vh}.kpi .value{font-size:clamp(25px,1.9vw,38px)}.kpi .small-note{font-size:clamp(12px,.85vw,17px);line-height:1.5}.chart-panel{min-height:0;padding:.5vh .8vw;flex:1}.chart-wrap{min-height:0;display:flex;align-items:stretch;justify-content:center;background:#fff;border-radius:9px;overflow:hidden}.original-chart{width:100%;height:100%;object-fit:fill;display:block}.story-columns{grid-template-columns:1fr 1.18fr 1fr;min-height:0}.story-column .cards{overflow-y:auto;flex:1;min-height:0;scrollbar-width:none;gap:1vh}.auto-scroll::-webkit-scrollbar{display:none}.story-card{flex-shrink:0;padding:.7vh .55vw}.story-card .title{font-size:clamp(16px,1.03vw,22px);line-height:1.48}.story-card .meta{font-size:clamp(13px,.85vw,18px);line-height:1.5}.scroll-hint{font-size:clamp(12px,.85vw,17px);color:var(--muted);line-height:1.45;margin-bottom:.65vh;flex-shrink:0}.testing-label{font-size:14px;color:var(--warn);font-weight:800;margin-bottom:.35vh}.gst-delivery{display:flex;flex-direction:column;flex:1;min-height:0;gap:1vh}.experiments-scroll{flex:1;min-height:0;overflow:auto;scrollbar-width:none}.experiments-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1vw}.experiment-card{padding:1.25vh 1.15vw;min-height:11vh}.experiment-card .title{font-size:clamp(19px,1.28vw,27px);line-height:1.45}.experiment-card .meta{font-size:clamp(14px,.9vw,19px);line-height:1.5}.experiment-state{font-size:clamp(12px,.88vw,18px);font-weight:750;color:var(--accent);margin-bottom:.55vh}.g-overview{gap:1.2vh}.two-col{flex:1.15;min-height:0}.quality-panel{flex:.85;min-height:0}.risk-list{flex:1;scrollbar-width:none}.risk-row{font-size:clamp(18px,1.2vw,25px);line-height:1.55}.g-score .value small{font-size:.42em}.g-note{font-size:clamp(19px,1.4vw,30px);line-height:1.55}.forecast-box .value{font-size:clamp(23px,1.6vw,34px);line-height:1.3}.forecast-box .value small{font-size:.63em}.forecast-box{min-height:12vh}.badge{font-size:clamp(13px,.95vw,19px)}.brand{font-weight:950;font-size:clamp(54px,4.25vw,94px)}.progress-fill{transition:none}.slide.leave{z-index:2}.slide.active.enter{z-index:3}
@media(max-height:800px){.goal-text{font-size:16px;line-height:1.4}.overview-head{min-height:10vh}.brand{font-size:42px}.story-card .title{font-size:15px}.story-card .meta{font-size:12px}.kpi .value{font-size:23px}.status-explain{font-size:13px}}

/* 每队的 OKR 首页，完整原文同页展示。 */
.okr-layout{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(330px,.8fr);gap:1.2vw;flex:1;min-height:0}
.okr-main,.okr-side{display:flex;flex-direction:column;min-height:0;gap:1vh}
.okr-intro,.okr-objectives,.okr-stat,.okr-values{padding:1.2vh 1.2vw}
.okr-intro{flex:0 0 auto}.okr-source{font-size:clamp(13px,.95vw,18px);color:var(--muted);line-height:1.5}
.okr-period{font-size:clamp(22px,1.7vw,34px);font-weight:850;margin:.4vh 0}
.okr-objectives,.okr-values{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
.okr-objective{padding:1.1vh 0 1.4vh;border-bottom:1px solid var(--line)}
.okr-objective:last-child{border-bottom:0}.okr-oid{font-size:clamp(13px,.9vw,18px);font-weight:850;color:var(--accent);letter-spacing:.08em}
.okr-title{font-size:clamp(20px,1.38vw,28px);font-weight:800;line-height:1.45;margin:.3vh 0 .7vh;overflow-wrap:anywhere}
.okr-description{color:var(--muted);font-size:clamp(13px,.92vw,18px);line-height:1.45;margin-bottom:.6vh}
.okr-kr{font-size:clamp(17px,1.08vw,22px);line-height:1.5;padding:.48vh 0 .48vh 1.5em;position:relative;overflow-wrap:anywhere}
.okr-kr:before{content:'KR';position:absolute;left:0;top:.6vh;font-size:.69em;font-weight:900;color:var(--hot)}
.okr-kr-value{color:var(--accent);font-weight:800;white-space:nowrap}.okr-stat{flex:0 0 auto}
.okr-count{font-size:clamp(38px,3.1vw,64px);font-weight:900;line-height:1.1;color:var(--accent)}
.okr-count small{font-size:.43em;color:var(--muted)}.okr-stat-note{font-size:clamp(15px,1vw,20px);color:var(--muted);line-height:1.5;margin-top:.5vh}
.okr-values h2{font-size:clamp(22px,1.6vw,32px);margin:0 0 .6vh}
.okr-value{padding:.85vh 0;border-bottom:1px solid var(--line);font-size:clamp(15px,.98vw,20px);line-height:1.45}
.okr-value strong{font-size:1.18em;color:var(--accent)}.okr-value .good{color:var(--good)}.okr-value .warn{color:var(--warn)}
@media(max-width:1100px){.okr-layout{grid-template-columns:minmax(0,1.5fr) minmax(270px,.8fr)}.okr-kr{font-size:15px}}

/* 所有列表静态展示，按页面空间分配卡片；溢出时生成同类型续页。 */
.okr-objectives,.okr-values,.story-column .cards,.experiments-scroll,.risk-list{overflow:visible!important}
.okr-objectives,.story-column .cards,.risk-list{justify-content:space-around}
.experiments-grid{min-height:100%;align-content:space-around}
.slide .story-card,.slide .experiment-card,.slide .okr-objective,.slide .okr-value{break-inside:avoid}

/* 固定每队四页：静态自适应布局，所有条目同屏展示。 */
.okr-layout{display:flex!important;flex-direction:column;gap:.65vh;min-height:0;flex:1}
.okr-intro{display:flex;align-items:center;gap:1.1vw;padding:.55vh 1vw;min-height:5.5vh;flex:0 0 auto}
.okr-period{font-size:clamp(19px,1.3vw,27px);margin:0;white-space:nowrap}
.okr-source{font-size:clamp(11px,.75vw,15px);line-height:1.3}
.okr-stat{display:flex;align-items:center;gap:1vw;padding:.5vh 1vw;min-height:5.5vh;flex:0 0 auto}
.okr-stat .label{white-space:nowrap}.okr-count{font-size:clamp(24px,1.9vw,37px);white-space:nowrap}

 const footer=slide.querySelector('.footer')?.getBoundingClientRect().top||innerHeight;
 const failures=[];for(const e of slide.querySelectorAll('.okr-objective,.okr-title,.okr-kr,.okr-kr-meta,.delivery-status-card,.delivery-status-card .title,.delivery-status-card .meta,.gst-open-card,.risk-row,.risk-title,.section-panel,.goal-panel,.forecast-box,.kpi,.g-note,.brand,.topline,.footer')){const r=e.getBoundingClientRect();if(e.scrollHeight>e.clientHeight+3||e.scrollWidth>e.clientWidth+3||(!e.classList.contains('footer')&&r.bottom>footer+3)||r.bottom>innerHeight+2||r.right>innerWidth+3||r.top< -2)failures.push({page:slide.dataset.pageId,element:e.className,text:e.textContent.slice(0,70)});}
 for(const svg of slide.querySelectorAll('svg.original-chart')){const vb=svg.viewBox.baseVal;for(const text of svg.querySelectorAll('text')){const r=text.getBBox();if(r.x<0||r.x+r.width>vb.width+1||r.y<0||r.y+r.height>vb.height+1)failures.push({page:slide.dataset.pageId,element:'chart-label',text:text.textContent});}}
 slide.className=was;return failures;
}
function build(){
 const made=[];DATA.teams.forEach(t=>[okrPage,overviewPage,deliveryPage,forecastPage].forEach(f=>made.push(f(t,made.length))));
 if(!made.length){const blank=node('section','slide active');blank.append(node('div','setup-empty','Sprint／OKR 标准母版\n尚未配置团队与数据。安装插件后填写配置，由 MCode 读取并核实数据生成主文件。\n此母版不包含任何团队业务数据。'));made.push(blank)}
 deck.replaceChildren(...made);slides=made;durations=made.map((s,i)=>PAGE_MS[i%4]);offsets=durations.map((_,i)=>durations.slice(0,i).reduce((a,b)=>a+b,0));cycle=durations.reduce((a,b)=>a+b,0);
 layoutIssues=[];made.forEach(s=>layoutIssues.push(...measure(s)));if(layoutIssues.length)$('controlNotice').textContent=`有 ${layoutIssues.length} 处内容无法完整容纳；生成端须调整后重新验收。`;
 current=-1;return made;
}
function timers(state){const clock=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;const now=Date.now(),left=Math.max(0,Math.ceil((state.duration-state.phase)/1000)),refresh=refreshInFlight?'更新中':nextRefreshAttempt>now?'重试 '+clock(Math.ceil((nextRefreshAttempt-now)/1000)):clock(Math.max(0,Math.ceil((refreshDeadline-now)/1000)));document.querySelectorAll('[data-slide-timer]').forEach(e=>e.textContent=clock(left));document.querySelectorAll('[data-refresh-timer]').forEach(e=>e.textContent=refresh);progress.style.width=(state.phase/state.duration*100)+'%';}
function tick(){const p=phaseAt((paused?pauseAt:Date.now())-origin);display(p.index,current>=0);timers(p);if(Date.now()>=refreshDeadline&&Date.now()>=nextRefreshAttempt&&!refreshInFlight)refreshDisplayData();requestAnimationFrame(tick);}
function jump(delta){origin=Date.now()-offsets[(Math.max(0,current)+delta+slides.length)%slides.length];if(paused)pauseAt=Date.now();}
function validateIncoming(data){
 if(data.schemaVersion!==1||!Array.isArray(data.teams)||data.teams.length!==DATA.teams.length||data.templateVersion!==DATA.templateVersion)throw Error('数据／母版版本不匹配，请覆盖同名文件并手动刷新。');
 const oldIds=DATA.teams.map(t=>t.id+':'+t.type),newIds=data.teams.map(t=>t.id+':'+t.type);if(JSON.stringify(oldIds)!==JSON.stringify(newIds))throw Error('团队或顺序改变，请手动刷新。');
 C.validateData(data,data.config);if(Date.parse(data.generatedAt)<Date.parse(DATA.generatedAt))throw Error('读取到过期版本。');
}
function applyDisplayData(data){
 validateIncoming(data);const saved=DATA,oldSlides=slides,oldPhase=phaseAt((paused?pauseAt:Date.now())-origin),id=slides[current]?.dataset.pageId,savedOrigin=origin;
 data.teams.forEach((t,i)=>t.theme=DATA.teams[i].theme);DATA=data;try{build();if(layoutIssues.length)throw Error('新数据无法单屏完整容纳');}catch(e){DATA=saved;deck.replaceChildren(...oldSlides);slides=oldSlides;durations=slides.map((_,i)=>PAGE_MS[i%4]);offsets=durations.map((_,i)=>durations.slice(0,i).reduce((a,b)=>a+b,0));cycle=durations.reduce((a,b)=>a+b,0);origin=savedOrigin;current=-1;display(oldPhase.index,false);throw e;}
 const index=Math.max(0,slides.findIndex(s=>s.dataset.pageId===id));origin=(paused?pauseAt:Date.now())-offsets[index]-Math.min(oldPhase.phase,durations[index]-1);display(index,false);
}
function readSyncedHtmlData(){return new Promise((resolve,reject)=>{
 const token=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),iframe=document.createElement('iframe'),url=new URL(location.href);iframe.hidden=true;iframe.setAttribute('aria-hidden','true');url.searchParams.set('__carousel_data_frame',token);url.hash='';let settled=false;
 const done=(error,data)=>{if(settled)return;settled=true;clearTimeout(timeout);window.removeEventListener('message',receive);iframe.remove();error?reject(error):resolve(data)};
 const receive=e=>{if(e.source===iframe.contentWindow&&e.data?.channel==='sprint-okr-local-data'&&e.data.token===token)done(null,e.data.data)};
 const timeout=setTimeout(()=>done(Error('读取同名文件超时')),10000);window.addEventListener('message',receive);iframe.addEventListener('error',()=>done(Error('文件不可读')),{once:true});iframe.src=url.href;document.body.append(iframe);
});}
async function refreshDisplayData(){if(refreshInFlight||refreshToken)return;refreshInFlight=true;try{const data=await readSyncedHtmlData();applyDisplayData(data);refreshDeadline=Date.now()+REFRESH_MS;nextRefreshAttempt=0;$('controlNotice').textContent='';}catch(e){nextRefreshAttempt=Date.now()+60000;$('controlNotice').textContent='读取失败，保留画面，1 分钟后重试。'+e.message;}finally{refreshInFlight=false;}}
if(refreshToken)window.parent.postMessage({channel:'sprint-okr-local-data',token:refreshToken,data:DATA},'*');
else{
 build();requestAnimationFrame(tick);$('previousSlide').onclick=()=>jump(-1);$('nextSlide').onclick=()=>jump(1);
 $('toggleFullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){$('controlNotice').textContent='请按 F11 或再次点击全屏。'}};
 document.addEventListener('fullscreenchange',()=>{$('toggleFullscreen').textContent=document.fullscreenElement?'⛶ 退出全屏':'⛶ 全屏';$('toggleFullscreen').setAttribute('aria-label',document.fullscreenElement?'退出全屏':'进入全屏');});
 document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')jump(1);if(e.key==='ArrowLeft')jump(-1);if(e.code==='Space'){e.preventDefault();paused=!paused;if(paused)pauseAt=Date.now();else origin+=Date.now()-pauseAt;}});
 window.addEventListener('resize',()=>{layoutIssues=[];slides.forEach(s=>layoutIssues.push(...measure(s)));});
}

</script></body></html>
